spring.application.name=nutrivida-backend

# Conexion a MySQL (XAMPP: usuario root sin contrasena)
spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (las tablas las crea Flyway, no Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (la clave puede sobreescribirse con la variable de entorno JWT_SECRET; minimo 32 caracteres)
jwt.secret=${JWT_SECRET:nutrivida-clave-secreta-jwt-desarrollo-2026-no-usar-en-produccion}
jwt.expiration-ms=3600000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
