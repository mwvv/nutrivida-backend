spring.application.name=nutrivida-backend

# Conexion a MySQL (XAMPP: usuario root sin contrasena)
spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (las tablas las crea Flyway, no Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (clave HMAC-SHA256 en base64, 256 bits). En producción define la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:NuFXHPaBjU4YcTnQzsJT0Md0U3w4YXdcunKkSb2bst8=}
jwt.expiration-ms=3600000
