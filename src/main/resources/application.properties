spring.application.name=nutrivida-backend

# Conexion a MySQL (XAMPP: usuario root sin contrasena)
spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (las tablas las crea Flyway, no Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
